name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build Rust Core
        run: cargo build --release --manifest-path packages/nerve-core/Cargo.toml
      - name: Run Test Suite
        run: bun run test
