<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nerve - Semantic Dungeon</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .node {
            position: absolute;
            width: 260px;
            height: 300px;
            background: rgba(0, 15, 0, 0.7);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: left;
            padding: 40px 25px;
            font-size: 0.65rem;
            line-height: 1.3;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            box-sizing: border-box;
            user-select: none;
            color: rgba(0, 255, 0, 0.8);
        }

        .node-header {
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 255, 0, 0.5);
            margin-bottom: 8px;
            width: 100%;
            padding-bottom: 4px;
            font-size: 0.75rem;
            color: #0f0;
        }

        .node-body {
            opacity: 0.7;
            mask-image: linear-gradient(to bottom, black 60%, transparent 95%);
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(5px, -15px) rotate(1deg); }
            66% { transform: translate(-5px, -10px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .node.floating {
            opacity: 0.4;
            filter: blur(1.5px);
            animation: float 8s ease-in-out infinite;
            z-index: 1;
        }

        .node.floating:hover {
            opacity: 0.9;
            filter: blur(0);
            transform: scale(1.15) !important;
            background: rgba(0, 30, 0, 0.95);
            border: 1px solid #0f0;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.3);
            z-index: 100;
        }

        .node.locked {
            background: #0f0;
            color: #000;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 0 15px #0f0;
            width: 150px;
            height: 173px;
            padding: 20px;
            font-size: 0.8rem;
        }
        
        .node.locked .node-body { display: none; }
        .node.locked .node-header { border: none; color: inherit; }

        #central-text {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-height: 550px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #0f0;
            padding: 40px;
            z-index: 50;
            line-height: 1.7;
            scrollbar-width: thin;
            scrollbar-color: #0f0 #000;
            box-shadow: 0 0 60px rgba(0, 0, 0, 1);
            backdrop-filter: blur(5px);
        }

        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .w { cursor: pointer; text-decoration: underline; }
        .w:hover { background: #0f0; color: #000; }
        .is-keyword { color: #fff; font-weight: bold; }
    </style>
</head>
<body style="background: #000 !important;">
    <div id="viewport">
        <div style="position:fixed; top:10px; left:10px; font-size:0.7rem; opacity:0.3; color:#0f0;">NERVE_v0.1.0_ARCH_STABLE</div>
        <svg id="connections"></svg>
        <div id="central-text">
            <div id="article-content">
                Lade semantische Matrix...
            </div>
        </div>
        <div id="nodes-container">
            <!-- Hexagons -->
        </div>
    </div>
    <script src="main.ts" type="module"></script>
</body>
</html>
