<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nerve - Semantic Dungeon</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .node {
            position: absolute;
            width: 150px;
            height: 173px;
            background: rgba(0, 20, 0, 0.8);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            border: 1px solid #0f0;
            box-sizing: border-box;
            user-select: none;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .node.floating {
            opacity: 0.6;
            filter: blur(0.5px);
            animation: float 4s ease-in-out infinite;
        }

        .node.floating:nth-child(even) {
            animation-delay: -2s;
        }

        .node.floating:hover {
            opacity: 1;
            filter: blur(0);
            transform: scale(1.1) rotate(2deg);
            background: rgba(0, 60, 0, 0.9);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
            z-index: 20;
        }

        .node.locked {
            background: #0f0;
            color: #000;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 0 15px #0f0;
        }

        .node.locked:hover::after {
            content: '× REMOVE';
            position: absolute;
            bottom: 20px;
            font-size: 0.6rem;
            letter-spacing: 1px;
        }

        #central-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            max-height: 500px;
            overflow-y: auto;
            background: rgba(5, 5, 5, 0.95);
            border: 1px solid #0f0;
            padding: 30px;
            z-index: 5;
            line-height: 1.6;
            scrollbar-width: thin;
            scrollbar-color: #0f0 #000;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.1);
        }

        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .w { cursor: pointer; text-decoration: underline; }
        .w:hover { background: #0f0; color: #000; }
        .is-keyword { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="viewport">
        <svg id="connections"></svg>
        <div id="central-text">
            <div id="article-content">
                <!-- Text segments -->
            </div>
        </div>
        <div id="nodes-container">
            <!-- Hexagons -->
        </div>
    </div>
    <script src="main.ts" type="module"></script>
</body>
</html>
