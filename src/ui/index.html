<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nerve - Semantic Dungeon</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace;
            width: 100vw;
            height: 100vh;
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .node {
            position: absolute;
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 0, 0.3);
            background: rgba(0, 15, 0, 0.8);
            transform: translate(-50%, -50%); /* Centered on left/top coordinates */
        }

        /* Central Node: The Focus */
        .node.center {
            width: 550px;
            height: 550px;
            left: 50%;
            top: 50%;
            z-index: 50;
            clip-path: polygon(5% 0%, 95% 0%, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0% 95%, 0% 5%); /* Chamfered box */
            display: flex;
            flex-direction: column;
            padding: 40px;
            font-size: 0.95rem;
            line-height: 1.6;
            border: 2px solid #0f0;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.2);
            backdrop-filter: blur(5px);
            cursor: default;
            color: #fff;
        }

        /* Hexagonal floating background nodes */
        .node.floating {
            width: 260px;
            height: 300px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            flex-direction: column;
            padding: 40px 25px;
            font-size: 0.65rem;
            line-height: 1.3;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.35;
            z-index: 10;
            color: rgba(0, 255, 0, 0.8);
            animation: float 8s ease-in-out infinite;
        }
        
        .node.floating:hover {
            opacity: 0.9;
            transform: translate(-50%, -50%) scale(1.15);
            background: rgba(0, 30, 0, 0.95);
            border: 1px solid #0f0;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.4);
            z-index: 100;
        }

        .node-header {
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 255, 0, 0.5);
            margin-bottom: 15px;
            width: 100%;
            padding-bottom: 8px;
            font-size: 0.85rem;
            color: #0f0;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .node-body {
            flex-grow: 1;
        }

        .floating .node-body {
            mask-image: linear-gradient(to bottom, black 60%, transparent 95%);
        }

        .center .node-body {
            mask-image: none; 
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #0f0 #000;
        }

        @keyframes float {
            0% { margin-top: 0px; }
            50% { margin-top: -15px; }
            100% { margin-top: 0px; }
        }

        /* Top breadcrumb bar for locked nodes history */
        #breadcrumb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid #0f0;
            display: flex;
            gap: 10px;
            z-index: 200;
            overflow-x: auto;
            white-space: nowrap;
            align-items: center;
            font-size: 0.8rem;
        }
        
        .breadcrumb-item {
            padding: 5px 15px;
            background: #0f0;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            transition: all 0.3s;
        }
        
        .breadcrumb-item:hover {
            background: #fff;
        }

        .w { cursor: pointer; text-decoration: underline; color: #0f0; }
        .w:hover { background: #0f0; color: #000; }
        .is-keyword { background: #0f0; color: #000; font-weight: bold; text-decoration: none; padding: 0 2px;}
        
        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="breadcrumb"></div>
    <div id="viewport">
        <div style="position:fixed; bottom:10px; left:10px; font-size:0.7rem; opacity:0.3; color:#0f0; z-index: 200;">NERVE_v0.2.0_ARCH_STABLE</div>
        <svg id="connections"></svg>
        <div id="nodes-container">
            <!-- Nodes (Center + Floating) -->
        </div>
    </div>
    <script src="main.ts" type="module"></script>
</body>
</html>
