<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nerve - Semantic Dungeon</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #111811 0%, #000000 100%); 
            color: #b3e6b3; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .node {
            position: absolute;
            transition: all 0.9s cubic-bezier(0.25, 1, 0.5, 1);
            box-sizing: border-box;
            background: linear-gradient(145deg, rgba(15, 35, 15, 0.4) 0%, rgba(5, 15, 5, 0.8) 100%);
            border-radius: 12px;
            transform: translate(-50%, -50%); 
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Central Node: The Focus */
        .node.center {
            width: 650px;
            height: 400px;
            left: 50%;
            top: 50%;
            z-index: 50;
            display: flex;
            flex-direction: column;
            padding: 40px 50px;
            font-size: 1rem;
            line-height: 1.7;
            background: linear-gradient(145deg, rgba(20, 45, 20, 0.8) 0%, rgba(5, 20, 5, 0.95) 100%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 255, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            cursor: default;
            color: #e0ffe0;
        }

        /* Elongated floating background nodes */
        .node.floating {
            width: 320px;
            height: 200px;
            display: flex;
            flex-direction: column;
            padding: 25px 30px;
            font-size: 0.75rem;
            line-height: 1.5;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.5;
            z-index: 10;
            color: #8abf8a;
            animation: float 12s ease-in-out infinite;
        }
        
        .node.floating:hover {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
            background: linear-gradient(145deg, rgba(25, 55, 25, 0.7) 0%, rgba(10, 25, 10, 0.9) 100%);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .node-header {
            font-weight: 600;
            margin-bottom: 12px;
            width: 100%;
            font-size: 0.8rem;
            color: #4ade80;
            text-transform: uppercase;
            letter-spacing: 2px;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .center .node-header {
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(74, 222, 128, 0.2);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .node-body {
            flex-grow: 1;
        }

        .floating .node-body {
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        .center .node-body {
            mask-image: none; 
            overflow-y: auto;
            scrollbar-width: none; /* Hide scrollbar for cleaner look */
        }

        @keyframes float {
            0% { margin-top: 0px; }
            50% { margin-top: -20px; }
            100% { margin-top: 0px; }
        }

        /* Top breadcrumb bar for locked nodes history */
        #breadcrumb {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 200;
            flex-wrap: wrap;
            max-width: 80%;
        }
        
        .breadcrumb-item {
            padding: 6px 16px;
            background: rgba(20, 50, 20, 0.6);
            color: #8abf8a;
            font-size: 0.75rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        
        .breadcrumb-item:hover {
            background: rgba(74, 222, 128, 0.2);
            color: #fff;
        }

        .w { cursor: pointer; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
        .w:hover { border-bottom: 1px solid #4ade80; color: #fff; }
        .is-keyword { color: #4ade80; font-weight: 600; text-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
        
        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div id="breadcrumb"></div>
    <div id="viewport">
        <div style="position:fixed; bottom:10px; left:10px; font-size:0.7rem; opacity:0.3; color:#0f0; z-index: 200;">NERVE_v0.2.0_ARCH_STABLE</div>
        <svg id="connections"></svg>
        <div id="nodes-container">
            <!-- Nodes (Center + Floating) -->
        </div>
    </div>
    <script src="main.ts" type="module"></script>
</body>
</html>
