<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nerve - Semantic Dungeon</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .node {
            position: absolute;
            width: 150px;
            height: 173px;
            background: rgba(0, 20, 0, 0.8);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #0f0;
            box-sizing: border-box;
        }

        .node:hover {
            transform: scale(1.1);
            background: rgba(0, 40, 0, 1);
            box-shadow: 0 0 20px #0f0;
        }

        .node.locked {
            background: #0f0;
            color: #000;
            font-weight: bold;
            z-index: 10;
        }

        .node.floating {
            opacity: 0.6;
            filter: blur(1px);
        }

        .node.floating:hover {
            opacity: 1;
            filter: blur(0);
        }

        #central-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #0f0;
            padding: 20px;
            z-index: 5;
            line-height: 1.5;
            scrollbar-width: thin;
            scrollbar-color: #0f0 #000;
        }

        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .w { cursor: pointer; text-decoration: underline; }
        .w:hover { background: #0f0; color: #000; }
        .is-keyword { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="viewport">
        <svg id="connections"></svg>
        <div id="central-text">
            <div id="article-content">
                <!-- Text segments -->
            </div>
        </div>
        <div id="nodes-container">
            <!-- Hexagons -->
        </div>
    </div>
    <script src="main.ts" type="module"></script>
</body>
</html>
